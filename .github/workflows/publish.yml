name: Publish Package

on:
  push:
    tags:
      - v*.*.*

permissions:
  # Required for OIDC authentication to npm (https://docs.npmjs.com/trusted-publishers)
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify package.json version matches tag
        run: |
          package_version="$(./bun -e 'console.log(require("./package.json").version)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match tag ($tag_version)"
            exit 1
          fi
          echo "package.json version ($package_version) matches tag ($tag_version)"
      - name: Install dependencies
        run: ./bun ci
      - name: Publish to npm
        # npm 11.5.1 or newer is required for OIDC authentication
        run: ./bun x "npm@>=11.5.1" publish
